on:
  workflow_dispatch:

  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - '.gitattributes'
      - 'psalm.xml'

  push:
    branches: ['master']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - '.gitattributes'
      - 'psalm.xml'

  schedule:
    - cron: '0 0 * * *'

name: ddd-template build

jobs:
  tests:
    name: PHP ${{ matrix.php }}-${{ matrix.os }}

    env:
      extensions: fileinfo, pdo, pdo_mysql, pdo_sqlite, intl, gd, openssl, dom, json, mbstring, curl, sodium, ctype

    runs-on: ${{ matrix.os }}
    timeout-minutes: 6

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

        php:
          - 8.4
          - 8.5

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install PHP with extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.extensions }}
          ini-values: date.timezone='UTC', max_execution_time=400, memory_limit=1024M
          tools: composer:v2
          coverage: none

      - name: Determine composer cache directory on Linux
        if: matrix.os == 'ubuntu-latest'
        run: echo "COMPOSER_CACHE_DIR=$(composer config cache-dir)" >> $GITHUB_ENV

      - name: Determine composer cache directory on Windows
        if: matrix.os == 'windows-latest'
        run: echo "COMPOSER_CACHE_DIR=~\AppData\Local\Composer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache dependencies installed with composer
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: php${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            php${{ matrix.php }}-composer-

      - name: Update composer
        run: composer self-update

      - name: Install dependencies with composer
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader --ansi

      - name: Run Testo unit suite
        run: php -d memory_limit=512M vendor/bin/testo --suite=Unit

  # Alpine (musl libc) build/install smoke check. Only the 3.22 leg runs for
  # now — the 8.5/edge pairing is temporarily disabled (see
  # invoice_dependency.yml upstream for why PHP/Alpine versions are paired
  # explicitly rather than a free matrix); re-enable once the edge issue
  # clears.
  tests-alpine:
    name: PHP ${{ matrix.php }}-alpine${{ matrix.alpine }}

    runs-on: ubuntu-latest
    container:
      image: alpine:${{ matrix.alpine }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '84'
            alpine: '3.22'

    steps:
      - name: Install glibc compatibility layer
        run: apk add --no-cache gcompat

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install PHP and extensions
        run: |
          apk add --no-cache \
            php${{ matrix.php }} \
            php${{ matrix.php }}-phar \
            php${{ matrix.php }}-bcmath \
            php${{ matrix.php }}-ctype \
            php${{ matrix.php }}-curl \
            php${{ matrix.php }}-dom \
            php${{ matrix.php }}-fileinfo \
            php${{ matrix.php }}-gd \
            php${{ matrix.php }}-iconv \
            php${{ matrix.php }}-intl \
            php${{ matrix.php }}-mbstring \
            php${{ matrix.php }}-openssl \
            php${{ matrix.php }}-pdo \
            php${{ matrix.php }}-pdo_mysql \
            php${{ matrix.php }}-pdo_sqlite \
            php${{ matrix.php }}-phar \
            php${{ matrix.php }}-simplexml \
            php${{ matrix.php }}-sodium \
            php${{ matrix.php }}-tokenizer \
            php${{ matrix.php }}-xml \
            php${{ matrix.php }}-xmlreader \
            php${{ matrix.php }}-xmlwriter \
            php${{ matrix.php }}-opcache
          ln -sf /usr/bin/php${{ matrix.php }} /usr/bin/php
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          rm composer-setup.php

      - name: Determine composer cache directory
        run: echo "COMPOSER_CACHE_DIR=$(composer config cache-dir)" >> $GITHUB_ENV

      - name: Cache dependencies installed with composer
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: php${{ matrix.php }}-alpine${{ matrix.alpine }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            php${{ matrix.php }}-alpine${{ matrix.alpine }}-composer-

      - name: Install dependencies with composer
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader --ansi

      - name: Run Testo unit suite
        run: php -d memory_limit=512M vendor/bin/testo --suite=Unit
